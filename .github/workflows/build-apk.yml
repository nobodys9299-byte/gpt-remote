name: Build Android APK & Windows Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build debug APKs
        run: ./gradlew testDebugUnitTest :app:assembleDebug :tv-app:assembleDebug --no-daemon

      - name: Prepare APKs for download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GptRemote-debug.apk
          cp tv-app/build/outputs/apk/debug/tv-app-debug.apk GptRemoteTV-debug.apk

      - name: Upload Android Phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GptRemote-debug-apk
          path: GptRemote-debug.apk

      - name: Upload Android TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GptRemoteTV-debug-apk
          path: GptRemoteTV-debug.apk

  build-pc-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller, mss, Pillow, and qrcode
        run: python -m pip install --upgrade pip pyinstaller mss pillow qrcode

      - name: Build standalone GptRemotePC.exe
        run: pyinstaller --onefile --noconsole --name GptRemotePC --icon pc-companion/gpt_remote.ico --add-data "pc-companion/gpt_remote.ico;." pc-companion/gpt_remote_pc.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build GptRemotePC-Setup.exe installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe).Source }
          & $iscc "/DAppVersion=2.0.${{ github.run_number }}" "pc-companion\GptRemotePC.iss"

      - name: Upload Windows Installer & Portable EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GptRemotePC-windows
          path: |
            dist/GptRemotePC-Setup.exe
            dist/GptRemotePC.exe

  release:
    needs: [build-apk, build-pc-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android Phone APK
        uses: actions/download-artifact@v4
        with:
          name: GptRemote-debug-apk
          path: release-assets

      - name: Download Android TV APK
        uses: actions/download-artifact@v4
        with:
          name: GptRemoteTV-debug-apk
          path: release-assets

      - name: Download Windows Installer & EXE
        uses: actions/download-artifact@v4
        with:
          name: GptRemotePC-windows
          path: release-assets

      - name: Publish latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GPT Remote (Latest Build)
          body: |
            Automated build from commit `${{ github.sha }}`.

            - **Android Phone App:** Download `GptRemote-debug.apk` (Android 9.0+).
            - **Android TV Companion App:** Download `GptRemoteTV-debug.apk` (install on Android TV / Google TV for Wi-Fi File Share, APK install, & Screen Cast).
            - **Windows PC Installer:** Download `GptRemotePC-Setup.exe` (installs desktop app, tray mode, screen share, two-way file sharing, and firewall rules).
            - **Windows Portable App:** Download `GptRemotePC.exe`.
          files: |
            release-assets/GptRemote-debug.apk
            release-assets/GptRemoteTV-debug.apk
            release-assets/GptRemotePC-Setup.exe
            release-assets/GptRemotePC.exe
          overwrite_files: true
          make_latest: true
