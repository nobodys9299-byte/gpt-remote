name: Build Android APK & Windows Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk MiTvRemote-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiTvRemote-debug-apk
          path: MiTvRemote-debug.apk

  build-pc-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone GptRemotePC.exe
        run: pyinstaller --onefile --noconsole --name GptRemotePC pc-companion/gpt_remote_pc.py

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GptRemotePC-exe
          path: dist/GptRemotePC.exe

  release:
    needs: [build-apk, build-pc-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: MiTvRemote-debug-apk
          path: release-assets

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: GptRemotePC-exe
          path: release-assets

      - name: Publish latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GPT Remote (Latest Build)
          body: |
            Automated build from commit `${{ github.sha }}`.

            - **Android App:** Download `MiTvRemote-debug.apk` (Android 9.0+).
            - **Windows Wi-Fi PC Receiver:** Download `GptRemotePC.exe` (no Python required).
          files: |
            release-assets/MiTvRemote-debug.apk
            release-assets/GptRemotePC.exe
          overwrite_files: true
          make_latest: true
